<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7fb">
  <meta name="description" content="Complete a simple verification to continue.">
  <meta name="robots" content="noindex,nofollow">
  <title>Security Verification</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/pressel.css?v=6">
  <script>
  /* UTM passthrough: keep email/name/utm params alive across the gate redirect */
  (function(){var K='spotify_utm_passthrough_v1';try{var st={};try{st=JSON.parse(localStorage.getItem(K)||'{}')||{};}catch(e){st={};}var q=new URLSearchParams(location.search),ch=false;q.forEach(function(v,k){if(v&&st[k]!==v){st[k]=v;ch=true;}});Object.keys(st).forEach(function(k){if(!q.get(k)){q.set(k,st[k]);ch=true;}});if(ch){localStorage.setItem(K,JSON.stringify(st));var qs=q.toString();history.replaceState(history.state,'',location.pathname+(qs?'?'+qs:'')+location.hash);}}catch(e){}})();
  </script>
  <script src="/pressel.js" defer></script>
</head>
<body>
  <main class="verification">
    <h1 class="verification-title"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3 4 7v5c0 4 3 7 8 9 5-2 8-5 8-9V7z" fill="#edf2ff" stroke="#3565df" stroke-width="1.5" stroke-linejoin="round"/><path d="m8.5 12 2.5 2.5 4.5-5" stroke="#3565df" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Security Verification</h1>
    <section class="verification-card" aria-label="Verification">
      <div class="card-body">
        <div class="verification-row">
          <button class="verify-box" id="verify" type="button" aria-label="Verify: I'm not a robot" aria-describedby="verify-status"><span id="check-icon" aria-hidden="true"></span></button>
          <label class="verify-label" for="verify">I'm not a robot</label>
          <div class="verification-mark">
            <svg width="36" height="36" viewBox="0 0 48 48" role="img" aria-label="Google">
              <path fill="#4285f4" d="M43.61 24.46c0-1.36-.12-2.66-.35-3.92H24v7.42h11a9.4 9.4 0 0 1-4.08 6.18v5.14h6.61c3.87-3.56 6.08-8.8 6.08-14.82z"/>
              <path fill="#34a853" d="M24 44c5.51 0 10.13-1.83 13.51-4.97l-6.61-5.14c-1.83 1.23-4.17 1.97-6.9 1.97-5.32 0-9.83-3.59-11.45-8.42H5.72v5.3A20.4 20.4 0 0 0 24 44z"/>
              <path fill="#fbbc05" d="M12.55 27.44A12.2 12.2 0 0 1 11.91 24c0-1.19.22-2.35.64-3.44v-5.3H5.72A20 20 0 0 0 3.6 24c0 3.22.77 6.26 2.12 8.74z"/>
              <path fill="#ea4335" d="M24 12.14c3 0 5.69 1.03 7.81 3.05l5.85-5.85C34.11 6.02 29.5 4 24 4A20.4 20.4 0 0 0 5.72 15.26l6.83 5.3C14.17 15.73 18.68 12.14 24 12.14z"/>
            </svg>
            <span>Local check</span>
          </div>
        </div>
        <p id="verify-status" class="verify-status" role="status" aria-live="polite" hidden></p>
      </div>
      <footer>Simple local verification · Not Google reCAPTCHA</footer>
    </section>
    <noscript><p class="noscript">Enable JavaScript to complete this verification.</p></noscript>
  </main>
  <dialog id="challenge" aria-labelledby="challenge-title" aria-describedby="challenge-description">
    <header class="challenge-header">
      <svg width="56" height="56" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="white" opacity=".2"/><circle cx="12" cy="12" r="9" fill="none" stroke="white" stroke-width="2"/><path d="M12 7v6m0 2v2" stroke="white" stroke-width="2"/></svg>
      <h2 id="challenge-title">Final Verification</h2>
      <p id="challenge-description">Please solve this simple math problem to continue</p>
    </header>
    <form id="challenge-form" class="challenge-body" novalidate>
      <div class="question"><p>1 + 1 = ?</p></div>
      <label for="answer">Enter the answer below</label>
      <input id="answer" name="answer" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="Your answer" aria-describedby="feedback" required>
      <p id="feedback" role="status" aria-live="polite" hidden></p>
      <button class="confirm" type="submit">Confirm Answer</button>
    </form>
  </dialog>
</body>
</html>
